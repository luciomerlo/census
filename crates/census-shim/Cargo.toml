[package]
name = "census-shim"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "Shim ABI-compatible con Everything64.dll: traduce el SDK a IPC de Census"

[lib]
name = "census_shim"
path = "src/lib.rs"
crate-type = ["cdylib"]

[dependencies]
census-ipc = { path = "../census-ipc" }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = [
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_System_Threading",
] }
