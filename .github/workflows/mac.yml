name: macOS (Intel + Apple silicon)

on:
  push:
    branches: [master, mac]
    paths:
      - "mac/**"
      - ".github/workflows/mac.yml"
  pull_request:
    paths:
      - "mac/**"
      - ".github/workflows/mac.yml"
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  MACOSX_DEPLOYMENT_TARGET: "12.0"

jobs:
  build:
    name: build-${{ matrix.arch }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15-intel
            arch: x86_64
            target: x86_64-apple-darwin
            app: Intel
          - runner: macos-15
            arch: aarch64
            target: aarch64-apple-darwin
            app: AppleSilicon
    steps:
      - uses: actions/checkout@v4
      - name: Rust stable
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable
          rustup target add "${{ matrix.target }}"
      - name: fmt
        run: cargo fmt --manifest-path mac/Cargo.toml -- --check
      - name: clippy
        run: cargo clippy --manifest-path mac/Cargo.toml --target "${{ matrix.target }}" --all-targets -- -D warnings
      - name: test
        run: cargo test --manifest-path mac/Cargo.toml --target "${{ matrix.target }}"
      - name: build release
        run: cargo build --manifest-path mac/Cargo.toml --release --target "${{ matrix.target }}"
      - name: app bundle
        run: |
          mkdir -p dist
          cp "mac/target/${{ matrix.target }}/release/censusindex" "dist/censusindex-${{ matrix.arch }}"
          chmod +x "dist/censusindex-${{ matrix.arch }}"
          cd mac
          ./scripts/make-icon.sh
          CENSUS_BIN="../dist/censusindex-${{ matrix.arch }}" \
            CENSUS_APP_NAME="CensusIndex-${{ matrix.app }}" \
            ./scripts/package.sh "${{ matrix.arch }}"
          ditto -c -k --sequesterRsrc --keepParent \
            "dist/CensusIndex-${{ matrix.app }}.app" \
            "dist/CensusIndex-${{ matrix.app }}.zip"
          (cd dist && shasum -a 256 "CensusIndex-${{ matrix.app }}.zip" > "CensusIndex-${{ matrix.app }}.zip.sha256")
          cp "dist/CensusIndex-${{ matrix.app }}.zip" "dist/CensusIndex-${{ matrix.app }}.zip.sha256" ../dist/
      - uses: actions/upload-artifact@v4
        with:
          name: censusindex-macos-${{ matrix.arch }}
          path: |
            dist/censusindex-${{ matrix.arch }}
            dist/CensusIndex-${{ matrix.app }}.zip
            dist/CensusIndex-${{ matrix.app }}.zip.sha256
          if-no-files-found: error

  universal:
    name: universal2
    needs: build
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: censusindex-macos-*
          path: dist
          merge-multiple: true
      - name: lipo
        run: |
          mkdir -p mac/dist
          lipo -create dist/censusindex-x86_64 dist/censusindex-aarch64 -output mac/dist/censusindex-universal
          chmod +x mac/dist/censusindex-universal
          cd mac
          ./scripts/make-icon.sh
          CENSUS_APP_NAME=CensusIndex-universal ./scripts/package.sh universal
          ditto -c -k --sequesterRsrc --keepParent \
            "dist/CensusIndex-universal.app" \
            "dist/CensusIndex-universal.zip"
          (cd dist && shasum -a 256 CensusIndex-universal.zip > CensusIndex-universal.zip.sha256)
          cp dist/censusindex-universal ../dist/
          cp dist/CensusIndex-universal.zip ../dist/
          cp dist/CensusIndex-universal.zip.sha256 ../dist/
          (cd ../dist && shasum -a 256 censusindex-universal CensusIndex-*.zip > SHA256SUMS.txt)
          cat ../dist/SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        with:
          name: censusindex-macos-universal
          path: |
            dist/censusindex-universal
            dist/CensusIndex-universal.zip
            dist/CensusIndex-universal.zip.sha256
            dist/SHA256SUMS.txt
          if-no-files-found: error
