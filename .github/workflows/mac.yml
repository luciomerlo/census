name: macOS (Intel + Apple silicon)

on:
  push:
    branches: [master, mac]
    paths:
      - "mac/**"
      - ".github/workflows/mac.yml"
  pull_request:
    paths:
      - "mac/**"
      - ".github/workflows/mac.yml"
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  MACOSX_DEPLOYMENT_TARGET: "12.0"

jobs:
  build:
    name: build-${{ matrix.arch }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15-intel
            arch: x86_64
            target: x86_64-apple-darwin
          - runner: macos-15
            arch: aarch64
            target: aarch64-apple-darwin
    steps:
      - uses: actions/checkout@v4
      - name: Rust stable
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable
          rustup target add "${{ matrix.target }}"
      - name: fmt
        run: cargo fmt --manifest-path mac/Cargo.toml -- --check
      - name: clippy
        run: cargo clippy --manifest-path mac/Cargo.toml --target "${{ matrix.target }}" --all-targets -- -D warnings
      - name: test
        run: cargo test --manifest-path mac/Cargo.toml --target "${{ matrix.target }}"
      - name: build release
        run: cargo build --manifest-path mac/Cargo.toml --release --target "${{ matrix.target }}"
      - name: artifact
        run: |
          mkdir -p dist
          cp "mac/target/${{ matrix.target }}/release/census" "dist/census-${{ matrix.arch }}"
          chmod +x "dist/census-${{ matrix.arch }}"
          file "dist/census-${{ matrix.arch }}"
      - uses: actions/upload-artifact@v4
        with:
          name: census-macos-${{ matrix.arch }}
          path: dist/census-${{ matrix.arch }}
          if-no-files-found: error

  universal:
    name: universal2
    needs: build
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: census-macos-*
          path: dist
          merge-multiple: true
      - name: lipo
        run: |
          lipo -create dist/census-x86_64 dist/census-aarch64 -output dist/census-universal
          chmod +x dist/census-universal
          lipo -info dist/census-universal
          codesign --force --sign - dist/census-universal
          shasum -a 256 dist/census-* > dist/SHA256SUMS.txt
          cat dist/SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        with:
          name: census-macos-universal
          path: |
            dist/census-universal
            dist/SHA256SUMS.txt
          if-no-files-found: error
