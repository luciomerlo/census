[workspace]

[package]
name = "census"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "Indice instantaneo de archivos para macOS (Intel y Apple silicon), compartido por Tailscale y expuesto por MCP"
repository = "https://github.com/luciomerlo/census"
default-run = "census"

[lib]
name = "census"
path = "src/lib.rs"

[[bin]]
name = "census"
path = "src/main.rs"

[dependencies]
serde = { version = "1", features = ["derive", "rc"] }
serde_json = "1"
jiff = "0.2"
memchr = "2"
tiny_http = "0.12"
ureq = { version = "2.12", default-features = false, features = ["native-tls", "json"] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = true
panic = "abort"
