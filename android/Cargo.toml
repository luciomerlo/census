[package]
name = "censusindex-android"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "CensusIndex para Android: nucleo nativo (reescaneo incremental, snapshot .cns, API v1) que carga la app Kotlin por JNI"

[lib]
name = "censusindex_android"
path = "src/lib.rs"
crate-type = ["cdylib", "rlib"]

[dependencies]
# Android es Linux: se reutiliza el walker, el indice, el snapshot .cns y la
# API HTTP v1 del crate linux/ (mismo contrato, mismo formato de snapshot).
censusindex = { path = "../linux" }
serde_json = "1"

[target.'cfg(target_os = "android")'.dependencies]
jni = "0.21"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = true
panic = "abort"

[workspace]
