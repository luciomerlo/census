[package]
name = "census-core"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "Indice instantaneo de archivos para Windows (NTFS): lee la MFT y sigue el USN Journal"

[workspace]
members = ["crates/census-ipc", "crates/census-shim"]
resolver = "2"

[[bin]]
name = "census"
path = "src/main.rs"

[lib]
name = "census"
path = "src/lib.rs"

[features]
default = ["gui"]
gui = ["dep:eframe"]

[dependencies]
census-ipc = { path = "crates/census-ipc" }
mft = "0.5"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
serde_json = "1"
ureq = { version = "2.12", default-features = false, features = ["tls", "json"] }
eframe = { version = "0.31", optional = true, default-features = false, features = ["default_fonts", "glow"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = [
    "Win32_Foundation",
    "Win32_Storage_FileSystem",
    "Win32_Security",
    "Win32_Security_Cryptography",
    "Win32_System_IO",
    "Win32_System_WindowsProgramming",
    "Win32_System_Console",
    "Win32_System_Threading",
    "Win32_UI_WindowsAndMessaging",
    "Win32_Graphics_Gdi",
] }

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
